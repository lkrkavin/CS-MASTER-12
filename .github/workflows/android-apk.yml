name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: app
        run: flutter create --platforms=android --org com.lkrkavin --project-name cs_master_12 .

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # First produce one installable universal APK. Measure its real size
      # before deciding whether ABI splitting or other size optimizations are needed.
      - name: Build universal release APK
        working-directory: app
        run: >-
          flutter build apk --release --no-shrink
          --dart-define=GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID }}
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Report APK size
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/app/outputs/flutter-apk/app-release.apk"
          test -f "$apk"
          bytes=$(stat -c%s "$apk")
          mib=$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b/1048576 }')
          echo "Universal APK size: $mib MiB ($bytes bytes)"
          {
            echo "### Universal APK size"
            echo "**$mib MiB** ($bytes bytes)"
            echo "This is the measured size; optimization decisions will be made after this build."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cs-master-12-android-universal
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
