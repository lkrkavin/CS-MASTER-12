name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: app
        run: flutter create --platforms=android --org com.lkrkavin --project-name cs_master_12 .

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # Build separate APKs per CPU architecture to avoid shipping unused
      # native libraries in one universal APK.
      - name: Build split release APKs
        working-directory: app
        run: >-
          flutter build apk --release --split-per-abi --no-shrink
          --dart-define=GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID }}
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Enforce 60 MB per-APK limit
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/app/outputs/flutter-apk/*-release.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "No release APKs were generated."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            bytes=$(stat -c%s "$apk")
            mib=$(( (bytes + 1048575) / 1048576 ))
            echo "$apk: $mib MiB"
            if (( bytes >= 60 * 1024 * 1024 )); then
              echo "APK exceeds the strict 60 MiB limit: $apk"
              exit 1
            fi
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: cs-master-12-android-release
          path: app/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14
